name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build PyInstaller bundle
        run: pyinstaller --clean PCAutoSpec.spec

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\PCAutoSpec.iss"

      - name: Upload PyInstaller bundle
        uses: actions/upload-artifact@v4
        with:
          name: PCAutoSpec-portable
          path: dist/PCAutoSpec

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PCAutoSpec-installer
          path: release/PCAutoSpec-Setup.exe
